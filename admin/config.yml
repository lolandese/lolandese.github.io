backend:
  name: github
  repo: lolandese/lolandese.github.io
  branch: master
  auth_type: pkce
  app_id: Ov23liFHoiELsgtKjkHs

# Enable local backend for development only
local_backend: false

# Set Italian as default UI language
locale: it

media_folder: assets/images
public_folder: /assets/images

site_url: https://lolandese.netlify.app

# Enable internationalization
i18n:
  structure: single_file
  locales: [it, en]
  default_locale: it

collections:
  - name: pages
    label: Pagine
    i18n:
      label: it
    files:
      - file: ai-coding.md
        label: Programmazione IA
        name: ai-coding
        preview_path: /ai-coding/
        fields:
          - { label: Layout, name: layout, widget: hidden, default: page }
          - { label: Titolo, name: title, widget: string }
          - { label: Intestazione, name: header, widget: string, required: false }
          - { label: Slogan, name: tagline, widget: string, required: false }
          - { label: Gruppo, name: group, widget: select, options: [navigation, footer], required: false }
          - { label: Icona, name: icon, widget: string, required: false }
          - { label: Contenuto, name: body, widget: markdown }
      - file: airbnb-it.md
