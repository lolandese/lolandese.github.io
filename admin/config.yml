  - name: posts
    label: Articoli
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{year}}/{{month}}/{{day}}/{{slug}}"
    fields:
      - { label: Titolo, name: title, widget: string }
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Data, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: "HH:mm:ss Z" }
      - { label: Categorie, name: categories, widget: string, required: false }
      - { label: Tag, name: tags, widget: string, required: false }
      - { label: Descrizione, name: description, widget: text, required: false }
      - { label: Contenuto, name: body, widget: markdown }
